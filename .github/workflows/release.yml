name: Build Windows Executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Derive release version
        id: version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Run source checks
        run: |
          python -m compileall -q main.py gpt_image_studio tests
          python tests/test_param_mapping.py

      - name: Check package version
        shell: pwsh
        run: |
          $packageVersion = python -c "import gpt_image_studio; print(gpt_image_studio.__version__)"
          if ($packageVersion -ne "${{ steps.version.outputs.version }}") {
            throw "Package version $packageVersion does not match tag version ${{ steps.version.outputs.version }}"
          }

      - name: Build PyInstaller executable
        run: pyinstaller --clean --noconfirm GPT-Image-Studio.spec

      - name: Rename release executable
        shell: pwsh
        run: |
          Move-Item "dist\GPT-Image-Studio.exe" "dist\GPT-Image-Studio-${{ steps.version.outputs.version }}.exe" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GPT-Image-Studio-${{ steps.version.outputs.version }}.exe
          generate_release_notes: true
